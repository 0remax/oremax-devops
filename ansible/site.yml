---
- name: Automate Oremax Multi-Tenant Web & Database Infrastructure
  hosts: local
  become: true

  vars:
    deployment_title: "Oremax Innovations Lifecycle"
    environment_profile: "Staging-Labs"
    # Web Tier Domains
    target_domains:
      - "labs.oremax.local"
      - "api.oremax.local"
      - "dev.oremax.local"
    
    # Database Tier Security Variables
    db_root_password: "OremaxSecureRootPass2026!"
    app_db_name: "oremax_staging_db"
    app_db_user: "oremax_user"
    app_db_password: "OremaxAppSecurePass2026!"

  tasks:
    # ==========================================
    # WEB TIER MODULES
    # ==========================================
    - name: Ensure Nginx is installed on the system
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure custom web root directories exist for all domains
      ansible.builtin.file:
        path: "/var/www/{{ item }}"
        state: directory
        mode: '0755'
        owner: www-data
        group: www-data
      loop: "{{ target_domains }}"

    - name: Deploy dynamic infrastructure health pages via Jinja2 Template
      ansible.builtin.template:
        src: templates/health_page.html.j2
        dest: "/var/www/{{ item }}/index.html"
        mode: '0644'
      loop: "{{ target_domains }}"

    - name: Compile and deploy Nginx Server Block configurations
      ansible.builtin.template:
        src: templates/nginx_vhost.conf.j2
        dest: "/etc/nginx/sites-available/{{ item }}.conf"
        mode: '0644'
      loop: "{{ target_domains }}"
      vars:
        server_domain: "{{ item }}"
        web_root_dir: "/var/www/{{ item }}"
      notify: Reload Nginx Engine

    - name: Enable the new server blocks via symbolic links
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ item }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ item }}.conf"
        state: link
      loop: "{{ target_domains }}"
      notify: Reload Nginx Engine

    - name: Ensure Nginx service is started and enabled on boot
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes


    # ==========================================
    # DATABASE TIER MODULES
    # ==========================================
    - name: Ensure MySQL Server package is installed
      ansible.builtin.apt:
        name: mysql-server
        state: present

    - name: Ensure MySQL service is running and enabled on boot
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: yes

    - name: Remove all anonymous MySQL user accounts
      mysql_user:
        name: ""
        host_all: true
        state: absent

    - name: Remove the default insecure MySQL test database
      mysql_db:
        name: test
        state: absent

    - name: Provision isolated application database
      mysql_db:
        name: "{{ app_db_name }}"
        state: present

    - name: Create dedicated application user and grant full DB access privileges natively
      ansible.builtin.command: >
        mysql -e "CREATE USER IF NOT EXISTS '{{ app_db_user }}'@'localhost' IDENTIFIED BY '{{ app_db_password }}';
        GRANT ALL PRIVILEGES ON {{ app_db_name }}.* TO '{{ app_db_user }}'@'localhost';
        FLUSH PRIVILEGES;"
      changed_when: true
